<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2C1810" />
  <meta name="description" content="Brew & Code - Premium Campus Café" />
  <title>Brew & Code</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coffee: {
              900: '#2C1810', // Primary Dark
              800: '#3D2419',
              700: '#4A2C2A', // Medium Brown
              600: '#6D4C41',
              500: '#8D6E63',
            },
            cream: {
              50: '#FFF8F3',  // Warm White
              100: '#FAF6F1', // Primary Light
              200: '#E8D5C4', // Border
            },
            brand: {
              red: '#C8102E', // Accent
              green: '#22863A',
              gold: '#D4AF37'
            }
          },
          fontFamily: {
            sans: ['"DM Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'soft': '0 12px 40px rgba(44, 24, 16, 0.08)',
            'card': '0 4px 20px rgba(44, 24, 16, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF6F1;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0",
    "react-router": "https://esm.sh/react-router@6.22.3?deps=react@18.2.0",
    "@remix-run/router": "https://esm.sh/@remix-run/router@1.15.3",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react,react-dom",
    "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.2",
    "react-hot-toast": "https://esm.sh/react-hot-toast@2.4.1?external=react,react-dom"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
